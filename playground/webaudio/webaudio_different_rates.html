<html>
  <head>
    <title>WebAudio Different Sample Rates Test</title>
  </head>
  <script>
    function assert_equals(actual, expected, message) {
      if (actual !== expected) {
        throw new Error(
          `Assertion failed: ${message}. Expected ${expected}, got ${actual}.`
        );
      }
    }

    function assert_not_equals(actual, expected, message) {
      if (actual === expected) {
        throw new Error(
          `Assertion failed: ${message}. Expected not ${expected}, got ${actual}.`
        );
      }
    }

    function assert_true(value, message) {
      if (!value) {
        throw new Error(
          `Assertion failed: ${message}. Expected true, got ${value}.`
        );
      }
    }

    function assert_false(value, message) {
      if (value) {
        throw new Error(
          `Assertion failed: ${message}. Expected false, got ${value}.`
        );
      }
    }

    function createSineWaveInput(rate, frequency = 440) {
      const ctx = new AudioContext({ sampleRate: rate });
      const osc = ctx.createOscillator();
      osc.type = "sine";
      osc.frequency.value = frequency;
      const dest = new MediaStreamAudioDestinationNode(ctx);
      osc.connect(dest);
      return { ctx, osc, dest };
    }

    async function waitForMessage(detectorNode, type, eventChecker = null) {
      assert_not_equals(
        detectorNode.context.state,
        "closed",
        `Detector at rate ${detectorNode.context.sampleRate} is closed.`
      );
      assert_equals(
        detectorNode.port.onmessage,
        null,
        "port.onmessage should be null before calling waitForMessage."
      );

      return new Promise((resolve, reject) => {
        let appendix = [];
        detectorNode.port.onmessage = (event) => {
          if (
            !event.data.type ||
            event.data.type != type ||
            (eventChecker && !eventChecker(event.data))
          ) {
            appendix.push(event.data);
            return;
          }
          // Clear the handler after receiving a message.
          detectorNode.port.onmessage = null;
          resolve({ data: event.data, appendix });
        };
      });
    }

    async function createAudioSource(rate, stream, cloneTracks) {
      const ctx = new AudioContext({ sampleRate: rate });
      const isolatedStream = new MediaStream(
        cloneTracks
          ? stream.getTracks().map((track) => track.clone())
          : stream.getTracks()
      );
      const sourceNode = ctx.createMediaStreamSource(isolatedStream);
      sourceNode.connect(ctx.destination);
      return sourceNode;
    }

    const CONNECTION_OPTIONS = {
      CONNECT_TO_SOURCE: { connectToSource: true, connectToDestination: false },
      CONNECT_TO_DESTINATION: {
        connectToSource: false,
        connectToDestination: true,
      },
      CONNECT_TO_BOTH: { connectToSource: true, connectToDestination: true },
      CONNECT_TO_NEITHER: {
        connectToSource: false,
        connectToDestination: false,
      },
    };
    async function createDetectorNode(
      sourceNode,
      connectionOptions = CONNECTION_OPTIONS.CONNECT_TO_BOTH
    ) {
      await sourceNode.context.audioWorklet.addModule("silence-detector.js");
      const detectorNode = new AudioWorkletNode(
        sourceNode.context,
        "silence-detector"
      );

      if (connectionOptions.connectToDestination) {
        detectorNode.connect(sourceNode.context.destination);
      }
      if (connectionOptions.connectToSource) {
        sourceNode.connect(detectorNode);
      }
      return detectorNode;
    }

    // Helper functions to wait for stateChanged messages after performing an action.
    async function waitForStateChangedsAfterAction(
      detectorNodes,
      action,
      eventChecker = null
    ) {
      const msgPromises = detectorNodes.map((node) =>
        waitForMessage(node, "stateChanged", eventChecker)
      );
      await action();
      return await Promise.all(msgPromises);
    }

    // Helper function to create test pairs and wait for them to become non-silent.
    async function createAndStartTestPairs(input, dstRates, cloneTracks) {
      // Create multiple MediaStreamAudioSourceNodes with different AudioContext sample rates.
      const pairs = [];
      for (const rate of dstRates) {
        const sourceNode = await createAudioSource(
          rate,
          input.dest.stream,
          cloneTracks
        );
        const detectorNode = await createDetectorNode(
          sourceNode,
          CONNECTION_OPTIONS.CONNECT_TO_BOTH
        );
        pairs.push({ sourceNode, detectorNode });
      }

      // Make sure all detectors are not silent after starting the oscillator.
      const msgs = await waitForStateChangedsAfterAction(
        pairs.map((p) => p.detectorNode),
        () => input.osc.start(),
        (data) => data.isSilentChanged
      );
      msgs.forEach((msg, i) => {
        assert_false(
          msg.data.isSilent,
          `Detector in context with rate ${pairs[i].detectorNode.context.sampleRate} should not be silent after oscillator starts.`
        );
      });

      return pairs;
    }

    async function waitForStateChangedAfterAction(
      detectorNode,
      action,
      eventChecker = null
    ) {
      return (
        await waitForStateChangedsAfterAction(
          [detectorNode],
          action,
          eventChecker
        )
      )[0];
    }

    async function ensureAudioSourceIsNotSilent(sourceNode) {
      const detectorNode = await createDetectorNode(
        sourceNode,
        CONNECTION_OPTIONS.CONNECT_TO_DESTINATION
      );

      const msg = await waitForStateChangedAfterAction(
        detectorNode,
        () => {
          sourceNode.connect(detectorNode);
        },
        (data) => data.isSilentChanged
      );

      assert_false(
        msg.data.isSilent,
        `Audio source in context with rate ${sourceNode.context.sampleRate} should not be silent.`
      );
      detectorNode.disconnect();
    }

    // Test template that handles setup, execution, and cleanup
    async function setupAndRunTest(
      tone,
      srcRate,
      dstRates,
      cloneTracks,
      testFn
    ) {
      assert_false(
        dstRates.includes(srcRate),
        "dstRates should not include srcRate."
      );

      const input = createSineWaveInput(srcRate, tone);
      const pairs = await createAndStartTestPairs(input, dstRates, cloneTracks);

      try {
        await testFn(input, pairs);
      } finally {
        // Clean up AudioContexts
        for (const { sourceNode } of pairs) {
          if (sourceNode.context.state !== "closed") {
            await sourceNode.context.close();
          }
        }
        if (input.ctx.state !== "closed") {
          await input.ctx.close();
        }
      }
    }

    // Test that closing a single AudioContext stops only that sourceNode, leaving others unaffected.
    async function testClosingOneContextStopsOnlyIt(
      tone,
      srcRate,
      dstRates,
      cloneTracks
    ) {
      await setupAndRunTest(
        tone,
        srcRate,
        dstRates,
        cloneTracks,
        async (input, pairs) => {
          const pairToClose = pairs.shift();
          await pairToClose.sourceNode.context.close();

          for (const { sourceNode } of pairs) {
            await ensureAudioSourceIsNotSilent(sourceNode);
          }
        }
      );
    }

    // Test that suspending a single AudioContext silences only that detector, leaving others unaffected.
    async function testSuspendingOneContextSilencesOnlyIt(
      tone,
      srcRate,
      dstRates,
      cloneTracks
    ) {
      await setupAndRunTest(
        tone,
        srcRate,
        dstRates,
        cloneTracks,
        async (input, pairs) => {
          const pairsToCheck = pairs.slice(1);
          const pairToSuspend = pairs[0];

          await pairToSuspend.sourceNode.context.suspend();

          for (const { sourceNode } of pairsToCheck) {
            await ensureAudioSourceIsNotSilent(sourceNode);
          }
        }
      );
    }

    // Test that disconnecting a single source node silences only its detector, leaving others unaffected.
    async function testDisconnectingOneSourceSilencesOnlyIt(
      tone,
      srcRate,
      dstRates,
      cloneTracks
    ) {
      await setupAndRunTest(
        tone,
        srcRate,
        dstRates,
        cloneTracks,
        async (input, pairs) => {
          const pairToDisconnect = pairs[0];
          const pairsToCheck = pairs.slice(1);

          pairToDisconnect.sourceNode.disconnect();

          for (const { sourceNode } of pairsToCheck) {
            await ensureAudioSourceIsNotSilent(sourceNode);
          }
        }
      );
    }

    // Test the effect of stopping MediaStreamTracks on detectors.
    // With cloned tracks: stopping one stream affects only its corresponding detector.
    // With shared tracks: stopping affects all detectors. Firefox detectors lose input, while Chromium-based detectors report silence.
    async function testStoppingOneMediaStream(
      tone,
      srcRate,
      dstRates,
      cloneTracks
    ) {
      await setupAndRunTest(
        tone,
        srcRate,
        dstRates,
        cloneTracks,
        async (input, pairs) => {
          const pairToStop = pairs[0];
          const pairsToCheck = pairs.slice(1);

          const stopStream = () => {
            pairToStop.sourceNode.mediaStream.getTracks().forEach((track) => {
              track.stop();
            });
          };

          if (cloneTracks) {
            stopStream();
            for (const { sourceNode } of pairsToCheck) {
              await ensureAudioSourceIsNotSilent(sourceNode);
            }
          } else {
            const msgs = await waitForStateChangedsAfterAction(
              pairsToCheck.map((p) => p.detectorNode),
              stopStream
            );
            msgs.forEach((msg, i) => {
              assert_true(
                !msg.data.hasInput || msg.data.isSilent,
                `Detector in context with rate ${pairsToCheck[i].detectorNode.context.sampleRate} should be silent or have no input after stopping the shared track.`
              );
            });
          }
        }
      );
    }

    // Test that disabling a MediaStream's tracks affects either just its own detector or all detectors.
    // With cloned tracks: disabling affects only its corresponding detector.
    // With shared tracks: disabling affects all detectors.
    async function testDisablingOneMediaStream(
      tone,
      srcRate,
      dstRates,
      cloneTracks
    ) {
      await setupAndRunTest(
        tone,
        srcRate,
        dstRates,
        cloneTracks,
        async (input, pairs) => {
          const pairToDisable = pairs[0];
          const pairsToCheck = pairs.slice(1);

          const disableStream = async () => {
            const msg = await waitForStateChangedAfterAction(
              pairToDisable.detectorNode,
              async () => {
                pairToDisable.sourceNode.mediaStream
                  .getTracks()
                  .forEach((track) => {
                    track.enabled = false;
                  });
              }
            );
            assert_true(
              msg.data.isSilent,
              `Detector in context with rate ${pairToDisable.detectorNode.context.sampleRate} should be silent after disabling its stream.`
            );
          };

          if (cloneTracks) {
            await disableStream();
            for (const { sourceNode } of pairsToCheck) {
              await ensureAudioSourceIsNotSilent(sourceNode);
            }
          } else {
            const msgs = await waitForStateChangedsAfterAction(
              pairsToCheck.map((p) => p.detectorNode),
              disableStream
            );
            msgs.forEach((msg, i) => {
              assert_true(
                msg.data.isSilent,
                `Detector in context with rate ${pairsToCheck[i].detectorNode.context.sampleRate} should be silent after disabling the first stream.`
              );
            });
          }
        }
      );
    }

    // Test that removing tracks from a single MediaStream affects only that detector, leaving others unaffected.
    async function testRemovingTracksInOneMediaStream(
      tone,
      srcRate,
      dstRates,
      cloneTracks
    ) {
      await setupAndRunTest(
        tone,
        srcRate,
        dstRates,
        cloneTracks,
        async (input, pairs) => {
          const pairToModify = pairs[0];
          const pairsToCheck = pairs.slice(1);

          const tracks = pairToModify.sourceNode.mediaStream.getTracks();
          tracks.forEach((track) => {
            pairToModify.sourceNode.mediaStream.removeTrack(track);
          });

          for (const { sourceNode } of pairsToCheck) {
            await ensureAudioSourceIsNotSilent(sourceNode);
          }
        }
      );
    }

    // Test the impact of stopping the original input stream on detectors.
    // When tracks are cloned: detectors continue to receive audio.
    // When tracks are shared: detectors lose their input or become silent after stopping the source stream.
    async function testStoppingInputStream(
      tone,
      srcRate,
      dstRates,
      cloneTracks
    ) {
      await setupAndRunTest(
        tone,
        srcRate,
        dstRates,
        cloneTracks,
        async (input, pairs) => {
          const stopInputStream = () => {
            input.dest.stream.getTracks().forEach((track) => track.stop());
          };

          if (cloneTracks) {
            stopInputStream();
            for (const { sourceNode } of pairs) {
              await ensureAudioSourceIsNotSilent(sourceNode);
            }
          } else {
            const msgs = await waitForStateChangedsAfterAction(
              pairs.map((p) => p.detectorNode),
              stopInputStream
            );
            msgs.forEach((msg, i) => {
              assert_true(
                msg.data.isSilent || !msg.data.hasInput,
                `Detector in context with rate ${pairs[i].detectorNode.context.sampleRate} should be silent or have no input after stopping the shared input stream.`
              );
            });
          }
        }
      );
    }

    // Test that suspending the input AudioContext silences all detectors.
    async function testSuspendingInputContextSilencesAll(
      tone,
      srcRate,
      dstRates,
      cloneTracks
    ) {
      await setupAndRunTest(
        tone,
        srcRate,
        dstRates,
        cloneTracks,
        async (input, pairs) => {
          const msgs = await waitForStateChangedsAfterAction(
            pairs.map((p) => p.detectorNode),
            async () => {
              await input.ctx.suspend();
            }
          );
          msgs.forEach((msg, i) => {
            assert_true(
              msg.data.isSilent,
              `Detector in context with rate ${pairs[i].detectorNode.context.sampleRate} should be silent after suspending the input context.`
            );
          });
        }
      );
    }

    // Test that closing the input AudioContext silences all detectors.
    async function testClosingInputContextSilencesAll(
      tone,
      srcRate,
      dstRates,
      cloneTracks
    ) {
      await setupAndRunTest(
        tone,
        srcRate,
        dstRates,
        cloneTracks,
        async (input, pairs) => {
          const msgs = await waitForStateChangedsAfterAction(
            pairs.map((p) => p.detectorNode),
            async () => {
              await input.ctx.close();
            }
          );
          msgs.forEach((msg, i) => {
            assert_true(
              msg.data.isSilent,
              `Detector in context with rate ${pairs[i].detectorNode.context.sampleRate} should be silent after closing the input context.`
            );
          });
        }
      );
    }

    async function runAllTests(srcRate, dstRates, cloneTracks) {
      const notes = {
        C4: 261.63,
        D4: 293.66,
        E4: 329.63,
        F4: 349.23,
        G4: 392.0,
        A4: 440.0,
        B4: 493.88,
        C5: 523.25,
        D5: 587.33,
        E5: 659.25,
      };

      await testClosingOneContextStopsOnlyIt(
        notes.C4,
        srcRate,
        dstRates,
        cloneTracks
      );
      await testSuspendingOneContextSilencesOnlyIt(
        notes.D4,
        srcRate,
        dstRates,
        cloneTracks
      );
      await testDisconnectingOneSourceSilencesOnlyIt(
        notes.E4,
        srcRate,
        dstRates,
        cloneTracks
      );
      await testStoppingOneMediaStream(
        notes.F4,
        srcRate,
        dstRates,
        cloneTracks
      );
      await testDisablingOneMediaStream(
        notes.G4,
        srcRate,
        dstRates,
        cloneTracks
      );
      await testRemovingTracksInOneMediaStream(
        notes.A4,
        srcRate,
        dstRates,
        cloneTracks
      );
      await testStoppingInputStream(notes.B4, srcRate, dstRates, cloneTracks);
      await testSuspendingInputContextSilencesAll(
        notes.C5,
        srcRate,
        dstRates,
        cloneTracks
      );
      await testClosingInputContextSilencesAll(
        notes.D5,
        srcRate,
        dstRates,
        cloneTracks
      );

      // Tests for destination contexts have identical sample rates
      for (let i = 0; i < dstRates.length; i++) {
        const rates = [dstRates[i], dstRates[i]];
        const tone = notes.E5 * Math.pow(2, i / 12);
        await testRemovingTracksInOneMediaStream(
          tone,
          srcRate,
          rates,
          cloneTracks
        );
      }
    }

    async function run() {
      const srcRate = 44100;
      const dstRates = [32000, 48000, 96000];
      const trackUsages = { cloned: true, shared: false };

      // Tests with shared MediaStreamTracks.
      await runAllTests(srcRate, dstRates, trackUsages.shared);

      // Tests with cloned MediaStreamTracks.
      await runAllTests(srcRate, dstRates, trackUsages.cloned);

      console.log("All tests completed.");
    }

    window.addEventListener("DOMContentLoaded", (event) => {
      const btn = document.createElement("button");
      btn.textContent = "start";
      document.body.appendChild(btn);

      btn.addEventListener("click", async () => {
        btn.disabled = true;
        btn.textContent = "running...";

        await run();

        btn.textContent = "start";
        btn.disabled = false;
      });
    });
  </script>
  <body>
    <p>
      Testing MediaStreamAudioSourceNode using a MediaStream with a sample rate
      different from the AudioContext.
    </p>
  </body>
</html>
