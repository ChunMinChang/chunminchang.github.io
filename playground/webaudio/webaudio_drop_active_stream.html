<html>
  <head>
    <title>Web Audio Drop Active Stream</title>
    <script>
      async function runTest() {
        const iframe = document.createElement("iframe");
        iframe.srcdoc = `
          <!DOCTYPE html>
          <html>
          <head>
            <script>
              (async () => {
                const ctx = new AudioContext({ sampleRate: 32000 });

                const stream = await navigator.mediaDevices.getUserMedia({
                  audio: true,
                  fake: true  // Use fake device for testing
                });

                const sourceNode = ctx.createMediaStreamSource(stream);

                sourceNode.connect(ctx.destination);

                // Ensure audio is flowing using AudioWorklet silence detector
                const silenceDetectorCode = \`
                  class SilenceDetector extends AudioWorkletProcessor {
                    constructor() {
                      super();
                      this.isSilent = true;
                      this.hasInput = false;
                    }

                    process(inputs, outputs, parameters) {
                      const input = inputs[0];
                      const currentHasInput = input && input.length > 0;

                      let isCurrentlySilent = true;
                      if (currentHasInput) {
                        const channel = input[0];
                        for (let i = 0; i < channel.length; i++) {
                          if (channel[i] !== 0) {
                            isCurrentlySilent = false;
                            break;
                          }
                        }
                      }

                      const hasInputChanged = this.hasInput !== currentHasInput;
                      const isSilentChanged = this.isSilent !== isCurrentlySilent;

                      this.hasInput = currentHasInput;
                      this.isSilent = isCurrentlySilent;

                      if (hasInputChanged || isSilentChanged) {
                        this.port.postMessage({
                          type: "stateChanged",
                          isSilent: this.isSilent,
                          hasInput: this.hasInput,
                          hasInputChanged: hasInputChanged,
                          isSilentChanged: isSilentChanged,
                        });
                      }

                      return currentHasInput;
                    }
                  }

                  registerProcessor("silence-detector", SilenceDetector);
                \`;

                const blob = new Blob([silenceDetectorCode], { type: "application/javascript" });
                const moduleUrl = URL.createObjectURL(blob);
                await ctx.audioWorklet.addModule(moduleUrl);
                const detectorNode = new AudioWorkletNode(ctx, "silence-detector");

                // Wait for the detector to confirm audio is not silent
                const audioFlowingPromise = new Promise((resolve) => {
                  detectorNode.port.onmessage = (event) => {
                    if (event.data.isSilentChanged && !event.data.isSilent) {
                      detectorNode.port.onmessage = null;
                      resolve();
                    }
                  };
                });
                sourceNode.connect(detectorNode);
                await audioFlowingPromise;

                // Notify parent that setup is complete
                parent.postMessage("ready", "*");
              })();
            <\/script>
          </head>
          <body></body>
          </html>
        `;

        document.body.appendChild(iframe);

        // Wait for iframe to be ready, then close it
        window.addEventListener("message", (event) => {
          if (event.data === "ready") {
            console.log(
              "active web audio stream is set up in iframe. Starting drop test..."
            );

            // Close the iframe while MediaStream and MediaStreamAudioSourceNode are active
            iframe.remove();

            console.log("test complete.");
          }
        });
      }
      document.addEventListener("DOMContentLoaded", () => {
        const runButton = document.getElementById("run");
        runButton.addEventListener("click", async () => {
          runTest();
        });
      });
    </script>
  </head>
  <body>
    <h1>Web Audio Drop Active Stream Test</h1>
    <p>
      This test checks if the Web Audio API can handle dropping an active audio
      stream.
    </p>
    <button id="run">Start test</button>
  </body>
</html>
